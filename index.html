<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Simple Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131c;
      color: #f5f6fa;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: radial-gradient(ellipse at top, #252b3b, #10131c 65%);
    }

    .calculator {
      width: min(100%, 360px);
      padding: 1.25rem;
      border: 1px solid #343b4f;
      border-radius: 1.25rem;
      background: #191e2a;
      box-shadow: 0 1.5rem 4rem #0008;
    }

    h1 {
      margin: 0 0 1rem;
      color: #aab3c9;
      font-size: .85rem;
      font-weight: 650;
      letter-spacing: .12em;
      text-align: center;
      text-transform: uppercase;
    }

    .display {
      min-height: 5.25rem;
      margin-bottom: 1rem;
      padding: .8rem 1rem;
      overflow: hidden;
      border: 1px solid #343b4f;
      border-radius: .75rem;
      background: #10131c;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      color: #fff;
      font-size: clamp(2rem, 10vw, 2.75rem);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .65rem;
    }

    button {
      min-height: 3.75rem;
      border: 0;
      border-radius: .75rem;
      background: #292f3e;
      color: #f5f6fa;
      cursor: pointer;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 600;
      transition: background .15s, transform .15s;
    }

    button:hover { background: #394155; }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #a78bfa; outline-offset: 2px; }
    .utility { background: #3a4050; color: #d3d8e5; }
    .operator { background: #373052; color: #c9b8ff; }
    .operator:hover { background: #4a3e70; }
    .equals { grid-column: span 2; background: #7657d5; color: white; }
    .equals:hover { background: #8769e6; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <output class="display" id="display" aria-live="polite" aria-atomic="true">0</output>
    <div class="keys" aria-label="Calculator keys">
      <button class="utility" type="button" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" type="button" data-action="sign" aria-label="Change sign">±</button>
      <button class="utility" type="button" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" type="button" data-operator="÷" aria-label="Divide">÷</button>

      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <button class="operator" type="button" data-operator="×" aria-label="Multiply">×</button>

      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button class="operator" type="button" data-operator="−" aria-label="Subtract">−</button>

      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button class="operator" type="button" data-operator="+" aria-label="Add">+</button>

      <button type="button" data-action="decimal" aria-label="Decimal point">.</button>
      <button type="button" data-digit="0">0</button>
      <button class="utility" type="button" data-action="backspace" aria-label="Delete last digit">⌫</button>
      <button class="equals" type="button" data-action="equals">=</button>
    </div>
  </main>

  <script>
    const display = document.querySelector('#display');
    let current = '0';
    let stored = null;
    let operator = null;
    let waitingForOperand = false;

    function updateDisplay() {
      display.textContent = current.length > 14 ? Number(current).toPrecision(8) : current;
    }

    function enterDigit(digit) {
      if (current === 'Error' || waitingForOperand) {
        current = digit;
        waitingForOperand = false;
      } else {
        current = current === '0' ? digit : current + digit;
      }
      updateDisplay();
    }

    function calculate(a, b, op) {
      switch (op) {
        case '+': return a + b;
        case '−': return a - b;
        case '×': return a * b;
        case '÷': return b === 0 ? NaN : a / b;
        default: return b;
      }
    }

    function formatResult(value) {
      if (!Number.isFinite(value)) return 'Error';
      return String(Number(value.toPrecision(10)));
    }

    function chooseOperator(nextOperator) {
      const input = Number(current);
      if (operator && !waitingForOperand) {
        const result = calculate(stored, input, operator);
        current = formatResult(result);
        updateDisplay();
        stored = current === 'Error' ? null : Number(current);
      } else {
        stored = input;
      }
      operator = nextOperator;
      waitingForOperand = true;
    }

    function performAction(action) {
      switch (action) {
        case 'clear':
          current = '0'; stored = null; operator = null; waitingForOperand = false;
          break;
        case 'decimal':
          if (current === 'Error' || waitingForOperand) {
            current = '0.'; waitingForOperand = false;
          } else if (!current.includes('.')) {
            current += '.';
          }
          break;
        case 'sign':
          if (current !== '0' && current !== 'Error') current = String(-Number(current));
          break;
        case 'percent':
          if (current !== 'Error') current = formatResult(Number(current) / 100);
          break;
        case 'backspace':
          if (current === 'Error' || waitingForOperand || current.length <= 1 || (current.length === 2 && current[0] === '-')) {
            current = '0';
          } else {
            current = current.slice(0, -1);
          }
          waitingForOperand = false;
          break;
        case 'equals':
          if (operator && stored !== null && !waitingForOperand) {
            current = formatResult(calculate(stored, Number(current), operator));
            stored = null; operator = null; waitingForOperand = true;
          }
          break;
      }
      updateDisplay();
    }

    document.querySelector('.keys').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      else if (button.dataset.operator) chooseOperator(button.dataset.operator);
      else performAction(button.dataset.action);
    });

    document.addEventListener('keydown', (event) => {
      if (/^[0-9]$/.test(event.key)) enterDigit(event.key);
      else if (event.key === '.') performAction('decimal');
      else if (event.key === 'Backspace') performAction('backspace');
      else if (event.key === 'Escape') performAction('clear');
      else if (event.key === 'Enter' || event.key === '=') performAction('equals');
      else if (event.key === '+') chooseOperator('+');
      else if (event.key === '-') chooseOperator('−');
      else if (event.key === '*') chooseOperator('×');
      else if (event.key === '/') chooseOperator('÷');
      else return;
      event.preventDefault();
    });
  </script>
</body>
</html>
